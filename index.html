<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>JavaScript Array Methods</h2>
    <h2>join() or pop()</h2>
    <p>join() converts an array elements into a string.</p>
    <p>pop() removes the last element from an array.</p>
    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>
    <script>
        const fruits = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("myjoin").innerHTML = fruits.join(" * ");

        const fruits1 = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("myfirstpop").innerHTML = fruits1.pop();

        const fruits2 = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("mysecondpop").innerHTML = fruits2.pop();
    </script>

</body>

</html>
